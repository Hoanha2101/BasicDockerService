version: "3"
services:
  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - service-a
      - service-b
      - service-c

  service-a:
    image: nginx:alpine
    container_name: service-a
    ports:
      - "3001:80"
    volumes:
      - ./html/service-a:/usr/share/nginx/html:ro

  service-b:
    image: nginx:alpine
    container_name: service-b
    ports:
      - "3002:80"
    volumes:
      - ./html/service-b:/usr/share/nginx/html:ro

  service-c:
    image: nginx:alpine
    container_name: service-c
    ports:
      - "3003:80"
    volumes:
      - ./html/service-c:/usr/share/nginx/html:ro

    